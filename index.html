<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ネザーランドドワーフ 粘土造形 3D構造ビューア（精密改訂版）</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      background-color: #080c14;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 9999px;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .pin-label {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .pin-label:hover {
      transform: translate(-50%, -50%) scale(1.25);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body class="text-slate-100 min-h-screen w-screen relative overflow-hidden">

  <div id="canvas-container"></div>
  <div id="pins-overlay" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

  <!-- Top Header Bar -->
  <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-3 md:px-5 py-2.5 glass-panel border-b border-slate-800">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center font-bold text-lg border border-amber-500/30">
        🐰
      </div>
      <div>
        <h1 class="text-xs md:text-sm font-bold text-white flex items-center gap-1.5">
          ネザーランドドワーフ 粘土造形3D構造解析
          <span class="text-[10px] bg-emerald-950/90 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-700/50 font-medium">なだらかCカーブ精密版</span>
        </h1>
        <p class="text-[10px] text-slate-400 hidden sm:block">自然な連続円弧背線・コビー体型・折りたたみ後肢・短マズル</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-1.5">
      <button id="btn-turntable" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700 flex items-center gap-1 transition">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span id="turntable-text" class="text-[11px]">回転: OFF</span>
      </button>

      <button id="btn-snapshot" title="撮影 (高解像度PNG)" class="px-2.5 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-xs font-semibold text-white shadow-md flex items-center gap-1 transition active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><circle cx="12" cy="13" r="3" stroke-width="2"></circle></svg>
        <span class="text-[11px] hidden sm:inline">撮影</span>
      </button>

      <button id="btn-toggle-sidebar" class="md:hidden px-2 py-1.5 rounded-lg bg-slate-800 text-slate-200 border border-slate-700 text-xs flex items-center gap-1">
        <span>メニュー</span>
      </button>
    </div>
  </header>

  <!-- Left Side: Sculptor Controls -->
  <aside id="sidebar" class="absolute top-14 bottom-3 left-3 z-20 w-72 md:w-80 max-w-[calc(100vw-1.5rem)] flex flex-col gap-2 pointer-events-auto transition-transform duration-300">
    
    <!-- 1. Material Selector -->
    <div class="glass-panel rounded-xl p-3 shadow-xl">
      <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center justify-between">
        <span>🎨 表示マテリアル（造形検証）</span>
      </div>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <button data-mode="fur" class="mat-btn active p-2 rounded-lg bg-amber-600 text-white font-medium text-left flex items-center gap-2 transition">
          <span class="w-3 h-3 rounded-full bg-slate-300 border border-slate-400 shrink-0"></span>
          <span class="text-[11px] font-semibold">リアル毛並み</span>
        </button>
        <button data-mode="clay" class="mat-btn p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-left flex items-center gap-2 transition">
          <span class="w-3 h-3 rounded-full bg-slate-400 shrink-0"></span>
          <span class="text-[11px]">造形グレー(サフ)</span>
        </button>
        <button data-mode="terracotta" class="mat-btn p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-left flex items-center gap-2 transition">
          <span class="w-3 h-3 rounded-full bg-amber-700 shrink-0"></span>
          <span class="text-[11px]">テラコッタ</span>
        </button>
        <button data-mode="blockin" class="mat-btn p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-left flex items-center gap-2 transition">
          <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-pink-500 via-sky-400 to-amber-400 shrink-0"></span>
          <span class="text-[11px]">アタリ塊分解</span>
        </button>
      </div>

      <!-- Quick Toggles -->
      <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-300">
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
          <input type="checkbox" id="chk-wire" class="rounded border-slate-700 bg-slate-800 text-amber-500">
          <span>ワイヤ枠</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
          <input type="checkbox" id="chk-cushion" checked class="rounded border-slate-700 bg-slate-800 text-amber-500">
          <span>緑の座布団</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
          <input type="checkbox" id="chk-pins" checked class="rounded border-slate-700 bg-slate-800 text-amber-500">
          <span>部位ピン</span>
        </label>
      </div>
    </div>

    <!-- 2. Camera View Presets -->
    <div class="glass-panel rounded-xl p-3 shadow-xl">
      <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2">
        📷 視点切替（シルエット検査）
      </div>
      <div class="grid grid-cols-4 gap-1 text-[11px]">
        <button data-cam="photo" class="cam-btn col-span-2 py-1.5 px-2 rounded bg-amber-950 border border-amber-600/70 text-amber-200 font-bold hover:bg-amber-900 transition flex items-center justify-center gap-1">
          <span>📸 写真アングル (斜め右)</span>
        </button>
        <button data-cam="right" class="cam-btn col-span-2 py-1.5 px-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-center font-medium transition">
          右側面 (Cカーブ検証)
        </button>
        <button data-cam="front" class="cam-btn py-1.5 px-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-center transition">
          正面
        </button>
        <button data-cam="left" class="cam-btn py-1.5 px-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-center transition">
          左側面
        </button>
        <button data-cam="top" class="cam-btn py-1.5 px-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-center transition">
          真上
        </button>
        <button data-cam="rear" class="cam-btn py-1.5 px-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-center transition">
          背面
        </button>
      </div>
    </div>

    <!-- 3. Raking Light & Slicer Controls -->
    <div class="glass-panel rounded-xl p-3 shadow-xl">
      <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center justify-between">
        <span>💡 斜光ライティング（曲面の歪み検査）</span>
      </div>
      <div class="space-y-2 text-[11px]">
        <div>
          <div class="flex justify-between text-slate-400 mb-0.5">
            <span>光源回転角 (方位)</span>
            <span id="lbl-light-az" class="text-slate-200 font-mono">55°</span>
          </div>
          <input id="slider-light-az" type="range" min="0" max="360" value="55" class="w-full h-1 bg-slate-700 rounded-lg cursor-pointer accent-amber-500">
        </div>
        <div>
          <div class="flex justify-between text-slate-400 mb-0.5">
            <span>光源の高さ (仰角)</span>
            <span id="lbl-light-el" class="text-slate-200 font-mono">28°</span>
          </div>
          <input id="slider-light-el" type="range" min="5" max="85" value="28" class="w-full h-1 bg-slate-700 rounded-lg cursor-pointer accent-amber-500">
        </div>
        <div class="pt-1.5 border-t border-slate-800 flex items-center justify-between">
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-300">
            <input type="checkbox" id="chk-slicer" class="rounded border-slate-700 bg-slate-800 text-amber-500">
            <span>水平断面スライサー</span>
          </label>
          <span id="lbl-slice-val" class="text-slate-400 font-mono">100%</span>
        </div>
        <input id="slider-slicer" type="range" min="0" max="100" value="100" disabled class="w-full h-1 bg-slate-700 rounded-lg cursor-pointer opacity-40 accent-amber-500">
      </div>
    </div>

    <!-- 4. Anatomical Structure Checklist -->
    <div class="glass-panel rounded-xl p-3 shadow-xl flex-1 flex flex-col min-h-0">
      <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-1.5 flex items-center justify-between">
        <span>📋 部位別 造形チェックリスト</span>
        <span class="text-[9px] text-slate-400 font-normal">クリックで拡大</span>
      </div>
      <div id="anatomy-list" class="space-y-1 overflow-y-auto pr-1 flex-1 text-xs"></div>
    </div>
  </aside>

  <!-- Bottom Drawer for Active Pin Details -->
  <div id="pin-card" class="absolute bottom-3 left-3 right-3 md:left-88 md:right-6 z-20 glass-panel border border-amber-500/50 rounded-xl p-3.5 shadow-2xl transition-all duration-300 translate-y-36 opacity-0 pointer-events-none">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-2">
        <span id="card-num" class="w-5 h-5 rounded-full bg-amber-500 text-slate-950 font-bold text-xs flex items-center justify-center">1</span>
        <div>
          <h3 id="card-name" class="font-bold text-white text-xs md:text-sm">部位名</h3>
          <p id="card-sub" class="text-[10px] text-amber-300 font-mono">Structure</p>
        </div>
      </div>
      <button id="card-close-btn" class="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800 text-xs">✕</button>
    </div>
    <div class="mt-2 text-xs grid md:grid-cols-2 gap-2 text-slate-300 leading-relaxed">
      <div id="card-desc" class="bg-slate-950/70 p-2.5 rounded-lg border border-slate-800 text-[11px]"></div>
      <div id="card-tip" class="bg-amber-950/40 p-2.5 rounded-lg border border-amber-800/40 text-amber-200 text-[11px]"></div>
    </div>
  </div>

  <!-- Instruction badge -->
  <div id="hint-badge" class="absolute top-14 right-3 z-10 glass-panel text-slate-300 text-[11px] px-3 py-1.5 rounded-full border border-slate-700 pointer-events-none transition-opacity duration-500 flex items-center gap-1.5">
    <span>🖱️ ドラッグ: 360°回転 | ホイール: ズーム | 右ドラッグ: 移動</span>
  </div>

  <script>
    /* =========================================================================
       THREE.JS NETHERLAND DWARF RABBIT SCULPTURE VIEWER (SMOOTH C-CURVE)
       ========================================================================= */

    const ANATOMY_ITEMS = [
      {
        id: 'back',
        num: 1,
        name: '背中の滑らかな連続Cカーブ',
        sub: 'Smooth Continuous Cobby Spine Line',
        pos: [0.0, 0.98, -0.05],
        camPos: [2.5, 0.85, 0.0],
        lookAt: [0.0, 0.70, 0.0],
        desc: '腰の不自然なコブや段差を排し、うなじから肩、背中中央、腰、臀部（お尻）までが滑らかで一体的な半円弧を描くネザーランドドワーフ特有のコビー背線です。',
        tip: '【粘土造形】真横（右側面）から観察し、背骨のラインを1本の滑らかな半円弧としてヘラで整えます。ボリュームは上へ盛り上げるのではなく、太もも・脇腹への左右の広がりに割り振ります。'
      },
      {
        id: 'ear',
        num: 2,
        name: '耳（極めて短い直立スプーン耳）',
        sub: 'Short Upright Rounded Spoon Ears',
        pos: [0.10, 1.48, 0.06],
        camPos: [1.1, 1.6, 1.1],
        lookAt: [0.08, 1.35, 0.1],
        desc: '成体でも約5cm以下と非常に短く、頭頂部でほぼ平行に寄り添うように直立。先端は尖らず丸いスプーン状で、外縁に黒い毛の引き締まったパイピングが入ります。',
        tip: '【粘土造形】耳の長さは頭部全高の約0.4倍が黄金比。長くしすぎると別の品種に見えてしまうため、短く丸く厚みを持たせます。'
      },
      {
        id: 'head',
        num: 3,
        name: '頭部・短マズル（球状の丸頭）',
        sub: 'Spherical Compact Skull & Flat Face',
        pos: [0.22, 1.12, 0.40],
        camPos: [1.2, 1.2, 1.1],
        lookAt: [0.0, 1.08, 0.28],
        desc: '横から見ても正面から見ても丸い、極めて短く詰まったマズル。額から鼻先にかけての凹凸（ストップ）が平坦で、愛らしいお団子型です。',
        tip: '【粘土造形】アルミホイル芯はほぼ完全な球体にし、鼻口部の突き出しは最小限（平らな小丘程度）に抑えます。'
      },
      {
        id: 'cheek',
        num: 4,
        name: '頬袋・ほっぺ（下膨れのふくらみ）',
        sub: 'Plump Zygomatic Cheek Pads',
        pos: [0.32, 1.0, 0.26],
        camPos: [1.1, 0.95, 0.9],
        lookAt: [0.0, 1.0, 0.2],
        desc: '正面から見たときに横へ大きく張り出す豊かな頬毛のボリューム。首の境界を隠すほど膨らみ、正面シルエットをおにぎり型に見せています。',
        tip: '【粘土造形】目の斜め下からアゴにかけて左右均等に粘土玉を盛り、頭の球体と滑らかに馴染ませて下膨れを作ります。'
      },
      {
        id: 'eye',
        num: 5,
        name: '大きな黒目（側面に張り出す球体）',
        sub: 'Bulbous Dark Eyes & Lighter Eye Ring',
        pos: [0.27, 1.14, 0.24],
        camPos: [0.8, 1.25, 0.8],
        lookAt: [0.18, 1.12, 0.18],
        desc: '頭部側面に半球状に飛び出す漆黒の瞳。周囲に淡いアイリング毛があり、立体的な瞳の丸みが強調されます。',
        tip: '【粘土造形】市販の黒ガラスカボションやオニキスビーズを埋め込むか、造形後にUVレジンを盛ると濡れたような瑞々しい輝きが再現できます。'
      },
      {
        id: 'chest',
        num: 6,
        name: '首なしマフラー・胸元の肉付き',
        sub: 'Dewlap & Neckless Seamless Chest',
        pos: [0.12, 0.76, 0.38],
        camPos: [1.2, 0.8, 1.1],
        lookAt: [0.0, 0.72, 0.22],
        desc: '首のくびれが外見上ほとんどなく、アゴ下からそのまま豊かな胸元の白毛へと繋がります。マフラーを巻いたような丸みがあります。',
        tip: '【粘土造形】頭部と胴体を接合する際、アゴ下の隙間をしっかり粘土で埋め、首を作らずなだらかなスロープで胸へと繋げます。'
      },
      {
        id: 'thigh',
        num: 7,
        name: '折りたたまれた太もも（大腿部の塊）',
        sub: 'Tucked Massive Hindquarters',
        pos: [0.35, 0.44, -0.08],
        camPos: [1.4, 0.55, 0.2],
        lookAt: [0.1, 0.42, -0.08],
        desc: 'お座り姿勢では力強い後足が胴体の両サイドに完全に折りたたまれ、大きな半球状の肉塊となってお座りの安定した土台を形成します。',
        tip: '【粘土造形】胴体中心の芯材の両脇に、大きめの粘土の塊を「太もも」として左右対称に貼り付けて一体化させます。'
      },
      {
        id: 'foreleg',
        num: 8,
        name: '垂直に揃えた前足',
        sub: 'Parallel Upright Forelegs',
        pos: [0.09, 0.22, 0.30],
        camPos: [0.8, 0.30, 1.1],
        lookAt: [0.05, 0.22, 0.25],
        desc: '胸の真下から地面に向かって2本が平行に真っ直ぐ伸びる前足。足先は座布団の上にちょこんと前向きに接地します。',
        tip: '【粘土造形】前足を長く作りすぎると立位ポーズになってしまいます。短めに抑え、胴体底面と座布団との隙間を小さくします。'
      }
    ];

    const BLOCK_COLORS = {
      head: 0xff6b6b,
      cheeks: 0xff8e8e,
      ears: 0xffd166,
      eyes: 0x1e293b,
      torso: 0x4cc9f0,
      chest: 0x4895ef,
      thighs: 0xf77f00,
      forelegs: 0x06d6a0,
      feet: 0x118ab2,
      tail: 0x9d4edd,
      cushion: 0x468739
    };

    const container = document.getElementById('canvas-container');
    const pinsOverlay = document.getElementById('pins-overlay');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(2.0, 1.35, 1.9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.localClippingEnabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 5.5;
    controls.minDistance = 0.8;
    controls.target.set(0, 0.72, 0.08);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xdce7f5, 0.75);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.4);
    keyLight.position.set(2.5, 2.0, 2.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 8;
    const shadowD = 1.6;
    keyLight.shadow.camera.left = -shadowD;
    keyLight.shadow.camera.right = shadowD;
    keyLight.shadow.camera.top = shadowD;
    keyLight.shadow.camera.bottom = -shadowD;
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.5);
    fillLight.position.set(-2.2, 1.3, -1.8);
    scene.add(fillLight);

    const bounceLight = new THREE.DirectionalLight(0x86efac, 0.25);
    bounceLight.position.set(0, -2, 0);
    scene.add(bounceLight);

    const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 5.0);

    function createChinchillaFurTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#8e9399';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 42000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random();
        if (r < 0.36) {
          ctx.fillStyle = 'rgba(25, 28, 35, 0.48)';
        } else if (r < 0.74) {
          ctx.fillStyle = 'rgba(245, 247, 250, 0.55)';
        } else {
          ctx.fillStyle = 'rgba(165, 155, 140, 0.35)';
        }
        ctx.fillRect(x, y, 1.2, 1.2);
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      for (let i = 0; i < 80; i++) {
        const x = Math.random() * 512;
        ctx.fillRect(x, 0, Math.random() * 3 + 1, 512);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    const furTex = createChinchillaFurTexture();

    const mats = {
      fur: {
        body: new THREE.MeshStandardMaterial({
          map: furTex,
          color: 0xa4a9af,
          roughness: 0.88,
          metalness: 0.02,
          clippingPlanes: [clipPlane],
          clipShadows: true
        }),
        white: new THREE.MeshStandardMaterial({
          color: 0xf1f3f7,
          roughness: 0.92,
          clippingPlanes: [clipPlane]
        }),
        earInner: new THREE.MeshStandardMaterial({
          color: 0xd8b5b3,
          roughness: 0.94,
          clippingPlanes: [clipPlane]
        }),
        earRim: new THREE.MeshStandardMaterial({
          color: 0x22262d,
          roughness: 0.85,
          clippingPlanes: [clipPlane]
        }),
        eye: new THREE.MeshPhysicalMaterial({
          color: 0x05070a,
          roughness: 0.03,
          metalness: 0.1,
          transmission: 0.05,
          clearcoat: 1.0,
          clearcoatRoughness: 0.04
        }),
        eyeRing: new THREE.MeshStandardMaterial({
          color: 0xdde2ea,
          roughness: 0.9
        }),
        nose: new THREE.MeshStandardMaterial({
          color: 0x475569,
          roughness: 0.75
        })
      },
      clay: {
        body: new THREE.MeshStandardMaterial({
          color: 0x8892a0,
          roughness: 0.65,
          metalness: 0.0,
          clippingPlanes: [clipPlane],
          clipShadows: true
        }),
        eye: new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.3
        })
      },
      terracotta: {
        body: new THREE.MeshStandardMaterial({
          color: 0xb45309,
          roughness: 0.75,
          metalness: 0.0,
          clippingPlanes: [clipPlane],
          clipShadows: true
        }),
        eye: new THREE.MeshStandardMaterial({
          color: 0x451a03,
          roughness: 0.35
        })
      },
      blockin: {}
    };

    for (let k in BLOCK_COLORS) {
      mats.blockin[k] = new THREE.MeshStandardMaterial({
        color: BLOCK_COLORS[k],
        roughness: 0.5,
        clippingPlanes: [clipPlane],
        clipShadows: true
      });
    }

    const rabbitMeshRegistry = [];

    function registerMesh(mesh, category) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      rabbitMeshRegistry.push({ mesh, category });
      return mesh;
    }

    const rabbitRoot = new THREE.Group();
    scene.add(rabbitRoot);

    const torsoG = new THREE.Group();
    torsoG.position.set(0, 0.62, -0.02);
    torsoG.rotation.x = -0.26;
    rabbitRoot.add(torsoG);

    // Primary torso: seamless, organic single ellipsoid
    const torsoMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.53, 40, 36),
      mats.fur.body
    );
    torsoMesh.scale.set(0.92, 1.16, 1.26);
    registerMesh(torsoMesh, 'torso');
    torsoG.add(torsoMesh);

    // Gentle, smooth dorsal thoracic arch (no localized waist hump)
    const smoothArch = new THREE.Mesh(
      new THREE.SphereGeometry(0.48, 36, 32),
      mats.fur.body
    );
    smoothArch.position.set(0, 0.12, -0.06);
    smoothArch.scale.set(0.86, 0.98, 1.14);
    registerMesh(smoothArch, 'torso');
    torsoG.add(smoothArch);

    const chestMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.36, 36, 32),
      mats.fur.body
    );
    chestMesh.position.set(0, 0.68, 0.24);
    chestMesh.scale.set(0.92, 1.02, 0.94);
    chestMesh.rotation.x = 0.18;
    registerMesh(chestMesh, 'chest');
    rabbitRoot.add(chestMesh);

    const chestBib = new THREE.Mesh(
      new THREE.SphereGeometry(0.31, 32, 28),
      mats.fur.white
    );
    chestBib.position.set(0, 0.64, 0.39);
    chestBib.scale.set(0.72, 0.92, 0.46);
    registerMesh(chestBib, 'chest');
    rabbitRoot.add(chestBib);

    const headG = new THREE.Group();
    headG.position.set(0, 1.10, 0.20);
    rabbitRoot.add(headG);

    const headMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 40, 36),
      mats.fur.body
    );
    headMesh.scale.set(0.96, 0.92, 1.0);
    registerMesh(headMesh, 'head');
    headG.add(headMesh);

    const cheekGeo = new THREE.SphereGeometry(0.22, 32, 28);
    cheekGeo.scale(1.15, 0.88, 1.0);

    const rightCheek = new THREE.Mesh(cheekGeo, mats.fur.body);
    rightCheek.position.set(0.20, -0.08, 0.08);
    registerMesh(rightCheek, 'cheeks');
    headG.add(rightCheek);

    const leftCheek = new THREE.Mesh(cheekGeo, mats.fur.body);
    leftCheek.position.set(-0.20, -0.08, 0.08);
    registerMesh(leftCheek, 'cheeks');
    headG.add(leftCheek);

    const muzzleMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 28, 24),
      mats.fur.body
    );
    muzzleMesh.position.set(0, -0.10, 0.27);
    muzzleMesh.scale.set(0.92, 0.8, 1.05);
    registerMesh(muzzleMesh, 'head');
    headG.add(muzzleMesh);

    const noseMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 16, 16),
      mats.fur.nose
    );
    noseMesh.position.set(0, -0.05, 0.42);
    noseMesh.scale.set(1.0, 0.7, 0.7);
    registerMesh(noseMesh, 'head');
    headG.add(noseMesh);

    const eyeGeo = new THREE.SphereGeometry(0.078, 28, 28);
    const ringGeo = new THREE.TorusGeometry(0.079, 0.011, 16, 32);

    const rightEye = new THREE.Mesh(eyeGeo, mats.fur.eye);
    rightEye.position.set(0.28, 0.06, 0.11);
    registerMesh(rightEye, 'eyes');
    headG.add(rightEye);

    const rightRing = new THREE.Mesh(ringGeo, mats.fur.eyeRing);
    rightRing.position.copy(rightEye.position);
    rightRing.rotation.y = 1.35;
    registerMesh(rightRing, 'eyes');
    headG.add(rightRing);

    const leftEye = new THREE.Mesh(eyeGeo, mats.fur.eye);
    leftEye.position.set(-0.28, 0.06, 0.11);
    registerMesh(leftEye, 'eyes');
    headG.add(leftEye);

    const leftRing = new THREE.Mesh(ringGeo, mats.fur.eyeRing);
    leftRing.position.copy(leftEye.position);
    leftRing.rotation.y = -1.35;
    registerMesh(leftRing, 'eyes');
    headG.add(leftRing);

    function buildEar(isRight) {
      const ear = new THREE.Group();
      const sign = isRight ? 1 : -1;

      const outerMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 28, 24),
        mats.fur.body
      );
      outerMesh.scale.set(0.7, 1.8, 0.42);
      outerMesh.position.set(0, 0.20, 0);
      registerMesh(outerMesh, 'ears');
      ear.add(outerMesh);

      const innerMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.10, 24, 20),
        mats.fur.earInner
      );
      innerMesh.scale.set(0.55, 1.55, 0.28);
      innerMesh.position.set(0, 0.19, 0.032);
      registerMesh(innerMesh, 'ears');
      ear.add(innerMesh);

      const tipMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.082, 20, 16),
        mats.fur.earRim
      );
      tipMesh.scale.set(0.68, 0.48, 0.4);
      tipMesh.position.set(0, 0.38, 0);
      registerMesh(tipMesh, 'ears');
      ear.add(tipMesh);

      ear.position.set(sign * 0.10, 0.29, -0.04);
      ear.rotation.z = sign * -0.14;
      ear.rotation.x = -0.06;
      ear.rotation.y = sign * 0.10;
      return ear;
    }
    headG.add(buildEar(true));
    headG.add(buildEar(false));

    const thighGeo = new THREE.SphereGeometry(0.39, 32, 28);
    thighGeo.scale(0.64, 0.94, 1.20);

    const rightThigh = new THREE.Mesh(thighGeo, mats.fur.body);
    rightThigh.position.set(0.34, 0.40, -0.10);
    rightThigh.rotation.set(-0.22, 0.12, 0.18);
    registerMesh(rightThigh, 'thighs');
    rabbitRoot.add(rightThigh);

    const leftThigh = new THREE.Mesh(thighGeo, mats.fur.body);
    leftThigh.position.set(-0.34, 0.40, -0.10);
    leftThigh.rotation.set(-0.22, -0.12, -0.18);
    registerMesh(leftThigh, 'thighs');
    rabbitRoot.add(leftThigh);

    function buildForeleg(isRight) {
      const leg = new THREE.Group();
      const sign = isRight ? 1 : -1;

      const legMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.075, 0.085, 0.35, 24),
        mats.fur.body
      );
      legMesh.position.y = 0.175;
      registerMesh(legMesh, 'forelegs');
      leg.add(legMesh);

      const pawMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.092, 24, 20),
        mats.fur.white
      );
      pawMesh.position.set(0, 0.045, 0.065);
      pawMesh.scale.set(0.85, 0.52, 1.32);
      registerMesh(pawMesh, 'forelegs');
      leg.add(pawMesh);

      leg.position.set(sign * 0.10, 0.04, 0.30);
      leg.rotation.x = -0.04;
      return leg;
    }
    rabbitRoot.add(buildForeleg(true));
    rabbitRoot.add(buildForeleg(false));

    const hindFootGeo = new THREE.SphereGeometry(0.085, 20, 16);
    hindFootGeo.scale(0.86, 0.48, 1.35);

    const rightHindFoot = new THREE.Mesh(hindFootGeo, mats.fur.white);
    rightHindFoot.position.set(0.27, 0.042, 0.20);
    rightHindFoot.rotation.y = 0.20;
    registerMesh(rightHindFoot, 'feet');
    rabbitRoot.add(rightHindFoot);

    const leftHindFoot = new THREE.Mesh(hindFootGeo, mats.fur.white);
    leftHindFoot.position.set(-0.27, 0.042, 0.20);
    leftHindFoot.rotation.y = -0.20;
    registerMesh(leftHindFoot, 'feet');
    rabbitRoot.add(leftHindFoot);

    const tailMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 24, 20),
      mats.fur.white
    );
    tailMesh.position.set(0, 0.36, -0.62);
    tailMesh.scale.set(0.8, 1.1, 0.88);
    tailMesh.rotation.x = 0.32;
    registerMesh(tailMesh, 'tail');
    rabbitRoot.add(tailMesh);

    const cushionGroup = new THREE.Group();
    scene.add(cushionGroup);

    const cushionMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.96, 1.05, 0.09, 44),
      new THREE.MeshStandardMaterial({
        color: 0x3e8a31,
        roughness: 0.85,
        metalness: 0.02
      })
    );
    cushionMesh.scale.set(1.0, 1.0, 1.25);
    cushionMesh.position.y = -0.045;
    cushionMesh.receiveShadow = true;
    cushionGroup.add(cushionMesh);

    const seamMesh = new THREE.Mesh(
      new THREE.TorusGeometry(0.98, 0.025, 16, 44),
      new THREE.MeshStandardMaterial({ color: 0x2c6422, roughness: 0.9 })
    );
    seamMesh.rotateX(Math.PI / 2);
    seamMesh.scale.set(1.0, 1.25, 1.0);
    seamMesh.position.y = -0.02;
    cushionGroup.add(seamMesh);

    const grid = new THREE.GridHelper(5, 20, 0xf59e0b, 0x1e293b);
    grid.position.y = -0.091;
    scene.add(grid);

    const pinElements = [];

    ANATOMY_ITEMS.forEach(item => {
      const el = document.createElement('div');
      el.className = 'pin-label w-6 h-6 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs flex items-center justify-center shadow-lg shadow-amber-500/50 border-2 border-white select-none';
      el.innerText = item.num;
      el.setAttribute('title', item.name);
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        showAnatomyDetail(item);
      });
      pinsOverlay.appendChild(el);

      pinElements.push({
        element: el,
        worldPos: new THREE.Vector3(...item.pos)
      });
    });

    const anatomyList = document.getElementById('anatomy-list');
    ANATOMY_ITEMS.forEach(item => {
      const row = document.createElement('button');
      row.className = 'w-full text-left p-1.5 rounded-lg bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800 transition flex items-center gap-2 group';
      row.innerHTML = `
        <span class="w-4 h-4 rounded-full bg-slate-800 group-hover:bg-amber-500 text-slate-300 group-hover:text-slate-950 font-bold text-[10px] flex items-center justify-center shrink-0 transition">
          ${item.num}
        </span>
        <div class="truncate">
          <div class="font-semibold text-slate-200 group-hover:text-amber-300 text-[11px] truncate">${item.name}</div>
          <div class="text-[9px] text-slate-500 truncate">${item.sub}</div>
        </div>
      `;
      row.addEventListener('click', () => showAnatomyDetail(item));
      anatomyList.appendChild(row);
    });

    let isTweening = false;
    function smoothMoveCamera(camTargetPos, lookAtPos, duration = 850) {
      isTweening = true;
      const startPos = camera.position.clone();
      const endPos = new THREE.Vector3(...camTargetPos);
      const startTarget = controls.target.clone();
      const endTarget = new THREE.Vector3(...lookAtPos);
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        let t = Math.min(1, elapsed / duration);
        t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        camera.position.lerpVectors(startPos, endPos, t);
        controls.target.lerpVectors(startTarget, endTarget, t);
        controls.update();

        if (elapsed < duration) {
          requestAnimationFrame(step);
        } else {
          isTweening = false;
        }
      }
      requestAnimationFrame(step);
    }

    const pinCard = document.getElementById('pin-card');
    const cardNum = document.getElementById('card-num');
    const cardName = document.getElementById('card-name');
    const cardSub = document.getElementById('card-sub');
    const cardDesc = document.getElementById('card-desc');
    const cardTip = document.getElementById('card-tip');
    const cardClose = document.getElementById('card-close-btn');

    function showAnatomyDetail(item) {
      smoothMoveCamera(item.camPos, item.lookAt);
      cardNum.textContent = item.num;
      cardName.textContent = item.name;
      cardSub.textContent = item.sub;
      cardDesc.innerHTML = `<b class="text-amber-400 block mb-0.5">【構造の特徴】</b>${item.desc}`;
      cardTip.innerHTML = `${item.tip}`;

      pinCard.classList.remove('translate-y-36', 'opacity-0', 'pointer-events-none');
    }

    cardClose.addEventListener('click', () => {
      pinCard.classList.add('translate-y-36', 'opacity-0', 'pointer-events-none');
    });

    const matButtons = document.querySelectorAll('.mat-btn');
    matButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        matButtons.forEach(b => {
          b.classList.remove('bg-amber-600', 'text-white', 'active');
          b.classList.add('bg-slate-800', 'text-slate-300');
        });
        btn.classList.remove('bg-slate-800', 'text-slate-300');
        btn.classList.add('bg-amber-600', 'text-white', 'active');

        applyMaterialMode(btn.dataset.mode);
      });
    });

    function applyMaterialMode(mode) {
      const isWire = document.getElementById('chk-wire').checked;

      rabbitMeshRegistry.forEach(({ mesh, category }) => {
        let mat;
        if (mode === 'fur') {
          if (category === 'eyes') mat = mats.fur.eye;
          else if (category === 'ears' && mesh.geometry.parameters && mesh.geometry.parameters.radius === 0.10) mat = mats.fur.earInner;
          else if (category === 'ears' && mesh.geometry.parameters && mesh.geometry.parameters.radius === 0.082) mat = mats.fur.earRim;
          else if (category === 'tail' || mesh === chestBib || category === 'feet') mat = mats.fur.white;
          else if (mesh === noseMesh) mat = mats.fur.nose;
          else mat = mats.fur.body;
        } else if (mode === 'clay') {
          mat = category === 'eyes' ? mats.clay.eye : mats.clay.body;
        } else if (mode === 'terracotta') {
          mat = category === 'eyes' ? mats.terracotta.eye : mats.terracotta.body;
        } else if (mode === 'blockin') {
          mat = mats.blockin[category] || mats.blockin.torso;
        }

        mesh.material = mat;
        mesh.material.wireframe = isWire;
        mesh.material.needsUpdate = true;
      });
    }

    document.getElementById('chk-wire').addEventListener('change', (e) => {
      rabbitMeshRegistry.forEach(({ mesh }) => {
        mesh.material.wireframe = e.target.checked;
      });
    });

    document.getElementById('chk-cushion').addEventListener('change', (e) => {
      cushionGroup.visible = e.target.checked;
    });

    document.getElementById('chk-pins').addEventListener('change', (e) => {
      pinsOverlay.style.display = e.target.checked ? 'block' : 'none';
    });

    const CAM_PRESETS = {
      photo:  { pos: [2.0, 1.35, 1.9],  target: [0, 0.72, 0.08] },
      right:  { pos: [2.5, 0.85, 0],    target: [0, 0.70, 0] },
      front:  { pos: [0, 0.98, 2.5],    target: [0, 0.74, 0.12] },
      left:   { pos: [-2.5, 0.85, 0],   target: [0, 0.70, 0] },
      top:    { pos: [0, 3.0, 0.02],    target: [0, 0.55, 0] },
      rear:   { pos: [0, 0.85, -2.5],   target: [0, 0.65, -0.1] }
    };

    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = CAM_PRESETS[btn.dataset.cam];
        if (p) smoothMoveCamera(p.pos, p.target);
      });
    });

    let isAutoRotating = false;
    const btnTurntable = document.getElementById('btn-turntable');
    const turntableText = document.getElementById('turntable-text');
    btnTurntable.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      controls.autoRotate = isAutoRotating;
      controls.autoRotateSpeed = 2.0;
      turntableText.textContent = `回転: ${isAutoRotating ? 'ON' : 'OFF'}`;
      btnTurntable.classList.toggle('border-amber-500', isAutoRotating);
      btnTurntable.classList.toggle('text-amber-400', isAutoRotating);
    });

    const slAz = document.getElementById('slider-light-az');
    const slEl = document.getElementById('slider-light-el');
    const lblAz = document.getElementById('lbl-light-az');
    const lblEl = document.getElementById('lbl-light-el');

    function updateRakingLight() {
      const az = THREE.MathUtils.degToRad(parseFloat(slAz.value));
      const el = THREE.MathUtils.degToRad(parseFloat(slEl.value));
      const dist = 3.6;

      const lx = dist * Math.cos(el) * Math.sin(az);
      const ly = dist * Math.sin(el);
      const lz = dist * Math.cos(el) * Math.cos(az);

      keyLight.position.set(lx, ly, lz);
      lblAz.textContent = `${slAz.value}°`;
      lblEl.textContent = `${slEl.value}°`;
    }
    slAz.addEventListener('input', updateRakingLight);
    slEl.addEventListener('input', updateRakingLight);

    const chkSlicer = document.getElementById('chk-slicer');
    const slSlicer = document.getElementById('slider-slicer');
    const lblSlicer = document.getElementById('lbl-slice-val');

    chkSlicer.addEventListener('change', (e) => {
      slSlicer.disabled = !e.target.checked;
      slSlicer.classList.toggle('opacity-40', !e.target.checked);
      if (!e.target.checked) {
        clipPlane.constant = 5.0;
        lblSlicer.textContent = '100%';
      } else {
        updateSlicer();
      }
    });

    function updateSlicer() {
      const pct = parseFloat(slSlicer.value);
      const h = -0.1 + (pct / 100) * 2.0;
      clipPlane.constant = h;
      lblSlicer.textContent = `${pct}%`;
    }
    slSlicer.addEventListener('input', updateSlicer);

    document.getElementById('btn-snapshot').addEventListener('click', () => {
      pinsOverlay.style.display = 'none';
      renderer.render(scene, camera);

      const link = document.createElement('a');
      link.download = `netherland-dwarf-sculpt-${Date.now()}.png`;
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();

      if (document.getElementById('chk-pins').checked) {
        pinsOverlay.style.display = 'block';
      }
    });

    const btnSidebar = document.getElementById('btn-toggle-sidebar');
    const sidebar = document.getElementById('sidebar');
    btnSidebar.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-[110%]');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const tempV = new THREE.Vector3();
    function updatePins() {
      if (!document.getElementById('chk-pins').checked) return;
      const w2 = window.innerWidth / 2;
      const h2 = window.innerHeight / 2;

      pinElements.forEach(item => {
        tempV.copy(item.worldPos);
        tempV.project(camera);

        if (tempV.z > 1) {
          item.element.style.display = 'none';
          return;
        }
        item.element.style.display = 'flex';
        const sx = (tempV.x * w2) + w2;
        const sy = -(tempV.y * h2) + h2;
        item.element.style.left = `${sx}px`;
        item.element.style.top = `${sy}px`;
      });
    }

    const clock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const t = clock.getElapsedTime();
      if (!isTweening) {
        controls.update();
      }

      chestMesh.scale.x = 0.92 + Math.sin(t * 1.5) * 0.01;
      chestMesh.scale.z = 0.94 + Math.sin(t * 1.5) * 0.01;

      updatePins();
      renderer.render(scene, camera);
    }

    window.onload = function() {
      updateRakingLight();
      renderLoop();

      setTimeout(() => {
        const hint = document.getElementById('hint-badge');
        if (hint) {
          hint.style.opacity = '0';
          setTimeout(() => hint.remove(), 1000);
        }
      }, 4500);
    };
  </script>
